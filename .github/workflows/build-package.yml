name: NAStool Package
on:
  workflow_dispatch:
  push:
    paths:
      - version.py

jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            artifact: windows
            binary: nas-tools.exe
          - runner: ubuntu-latest
            artifact: linux-amd64
            binary: nas-tools.linux.amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Build server and test platform storage
        working-directory: backend
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath ./cmd/server
          go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/nas-tools-db
          go test ./internal/dbinit ./internal/diskusage
      - name: Install package dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install wheel cython pyinstaller==5.7.0
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pip install numpy==1.23.5 pyparsing==3.0.9 wxpython==4.2.0
          fi
          pip install -r package/requirements.txt
      - name: Build single-file package
        working-directory: package
        shell: bash
        run: |
          export NASTOOL_CONFIG="$GITHUB_WORKSPACE/config/config.yaml"
          vendor=$(python -c "from pathlib import Path; import setuptools; print(Path(setuptools.__file__).parent / '_vendor/pyparsing/diagram')")
          mkdir -p "$vendor"
          cp rely/template.jinja2 "$vendor/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then export PATH="$PWD/rely:$PATH"; fi
          pyinstaller nas-tools.spec
          if [[ "$RUNNER_OS" == "Linux" ]]; then mv dist/nas-tools dist/nas-tools.linux.amd64; fi
          python - 'dist/${{ matrix.binary }}' <<'PY'
          from pathlib import Path
          import sqlite3
          import subprocess
          import sys

          executable = Path(sys.argv[1]).resolve()
          config_dir = executable.parent / "config"
          for _ in range(2):
              subprocess.run([executable, "--init-db"], check=True)
          with sqlite3.connect((config_dir / "user.db").as_uri() + "?mode=ro", uri=True) as db:
              assert db.execute("SELECT count(*) FROM GO_INITIAL_DATA_SCRIPTS").fetchone() == (8,)
          with sqlite3.connect((config_dir / "media.db").as_uri() + "?mode=ro", uri=True) as db:
              assert db.execute("SELECT count(*) FROM MEDIASYNC_ITEMS").fetchone() == (0,)
              assert db.execute("PRAGMA quick_check").fetchone() == ("ok",)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/dist/${{ matrix.binary }}
          if-no-files-found: error

  container:
    strategy:
      matrix:
        include:
          - artifact: linux-arm64
            platform: linux/arm64
            dockerfile: package/builder/Dockerfile
            binary: nas-tools.linux.arm64
          - artifact: linux-musl-amd64
            platform: linux/amd64
            dockerfile: package/builder/alpine.Dockerfile
            binary: nas-tools.linux.musl.amd64
          - artifact: linux-musl-arm64
            platform: linux/arm64
            dockerfile: package/builder/alpine.Dockerfile
            binary: nas-tools.linux.musl.arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build single-file package
        run: |
          docker buildx build --platform ${{ matrix.platform }} --file ${{ matrix.dockerfile }} --output type=local,dest=./rootfs .
          mv rootfs/nas-tools rootfs/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rootfs/${{ matrix.binary }}
          if-no-files-found: error

  Create-release_Send-message:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: [native, container]
    steps:
      - uses: actions/checkout@v4

      - name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=$app_version" >> $GITHUB_ENV
      - name: Download exe and rename
        uses: actions/download-artifact@v4
      - name: get release_informations
        shell: bash
        run: |
          pwd
          ls -all
          mkdir releases
          mv ./windows/nas-tools.exe releases/nastool_win_v${{ env.app_version }}.exe
          mv ./linux-amd64/nas-tools.linux.amd64 releases/nastool_linux_amd64_v${{ env.app_version }}
          mv ./linux-arm64/nas-tools.linux.arm64 releases/nastool_linux_arm64_v${{ env.app_version }}
          mv ./linux-musl-amd64/nas-tools.linux.musl.amd64 releases/nastool_linux_musl_amd64_v${{ env.app_version }}
          mv ./linux-musl-arm64/nas-tools.linux.musl.arm64 releases/nastool_linux_musl_arm64_v${{ env.app_version }}
          pwd
          ls -all
      - name: Create release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.app_version }}
          release_name: v${{ env.app_version }}
          body: ${{ github.event.commits[0].message }}
          draft: false
          prerelease: false

      - name: Upload release asset
        uses: dwenegar/upload-release-assets@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
          assets_path: |
            ${{ github.workspace }}/releases/
